# Construit l'application Android de YEET CLUB.
#
# Réglages du dépôt (Settings → Secrets and variables → Actions) :
#   Variable TWA_HOST                 : nom de domaine du serveur, ex. yeetclub.mondomaine.fr
#   Secret ANDROID_KEYSTORE_BASE64    : clé d'envoi (upload key) encodée en base64
#   Secret ANDROID_KEYSTORE_PASSWORD  : mot de passe du keystore
#   Secret ANDROID_KEY_ALIAS          : alias de la clé
#   Secret ANDROID_KEY_PASSWORD       : mot de passe de la clé
#
# Sans clé, le workflow produit seulement un APK de test non signé.
# Avec la clé, il produit aussi le fichier .aab à envoyer sur Google Play.
name: Android

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TWA_HOST: ${{ vars.TWA_HOST }}
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.14.3'

      - name: Vérifier l'adresse du serveur
        run: |
          if [ -z "$TWA_HOST" ]; then
            echo "::warning::La variable TWA_HOST n'est pas définie : l'appli pointera vers yeetclub.example.com."
          else
            echo "Adresse du serveur : https://$TWA_HOST/"
          fi

      - name: Préparer la clé de signature
        id: key
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Aucune clé de signature : seul l'APK de test est construit."
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Construire
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ "${{ steps.key.outputs.signed }}" = "true" ]; then
            gradle --no-daemon assembleRelease bundleRelease
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Empreinte de la clé (pour assetlinks)
        if: steps.key.outputs.signed == 'true'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          keytool -list -v -keystore "$ANDROID_KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" | grep 'SHA256:' | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v5
        with:
          name: yeet-club-android-${{ github.run_number }}
          path: |
            android/app/build/outputs/apk/**/*.apk
            android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
